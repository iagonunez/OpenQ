[package]
name = "openq"
version = "0.5.2"
license = "Apache-2.0"
repository = "https://github.com/iagonunez/OpenQ"
description = "Show-control and cue playback system"
publish = false
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cpal = "0.18.2"
eframe = "0.35.0"
egui = "0.35"
# No colours, regex filters or timestamp crate: `errlog::stderr_logger` writes the time itself.
env_logger = { version = "0.11.11", default-features = false }
fastrand = "2.5.0"
ffmpeg-next = { version = "9", optional = true }
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff"] }
log = "0.4.34"
winit = { version = "0.30", default-features = false }
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
midir = "0.11.1"
parking_lot = "0.12.5"
# Waits for wgpu device requests in the video output process.
pollster = "0.4"
rfd = "0.17.2"
# Without "std" (only converts OSC times to SystemTime; pulled in the `time` crate).
rosc = { version = "0.11.4", default-features = false }
rtrb = "0.4.0"
# Fixture import: GDTF (zip + XML) and QLC+ (XML).
roxmltree = "0.21.1"
flate2 = "1.1.10"
rubato = "5.0.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.152", features = ["float_roundtrip"] }
socket2 = "0.6"
# Without libudev: Linux ports are listed from /sys/class/tty (only names are used).
serialport = { version = "4.10.1", default-features = false }
symphonia = { version = "0.6.1", features = ["all"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
cosmic-text = "0.19.0"
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "svgz", "raster-images"] }
# Fixture search and download from the Open Fixture Library website (HTTPS, rustls).
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "gzip"], optional = true }
# Network interfaces (remote discovery broadcasts on each one).
if-addrs = "0.15.0"

# macOS: native menu bar and the window-button position.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder", "NSView", "NSControl", "NSButton"] }
objc2-foundation = "0.2"

[build-dependencies]
# Windows: the icon in the .exe (build.rs).
winresource = "0.1"

[features]
default = ["video", "pipewire", "lighting"]
# The lighting workspace (Lighting view, Light cues, playback window) with fixture downloads. Without it
# OpenQ is cues only; lighting designs in a show are kept and still play.
lighting = ["fixture-download"]
video = ["dep:ffmpeg-next"]
# Linux: talk to PipeWire directly (every sink/source listed by name, no ALSA device busy errors).
# Needs the libpipewire-0.3 headers; without it (or without a running PipeWire) ALSA is used.
pipewire = ["cpal/pipewire"]
# Search and download fixtures from the Open Fixture Library website (HTTPS; rustls/ring need a C compiler).
fixture-download = ["dep:ureq"]
# Lets the stress tests make chosen code paths panic on purpose (see `recovery::Fault`).
fault-injection = []

# The smoke test plays movies and stills, so it needs FFmpeg.
[[example]]
name = "smoke"
required-features = ["video"]

[profile.dev.package."*"]
opt-level = 2
