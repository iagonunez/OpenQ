# Unit, stress, soak, fuzz and crash-recovery tests (tests/stress.rs, tests/fuzz.rs). Users install OpnQ with OQup
# (https://github.com/iagonunez/OQup), which downloads the binaries release.yml publishes for a `v*` tag or builds
# that tag from source (`--build-source`). A `v*` tag marks a version OQup offers, so tags run this; it can also be
# run by hand.
# The tests run on Linux, macOS and Windows without a sound card (virtual audio output) and
# without FFmpeg (no `video` feature). OQup's own "End to end" workflow builds the full app on Linux, macOS and Windows.
#
# Triggers: a new `v*` tag starts it through `create` (one event per tag created) and through
# `push` (tags). GitHub sometimes sends only one of the two (a tag pushed in the same `git push`
# as a branch, force-pushed tags, and no events at all when more than three tags are pushed at
# once: push tags one by one), so both are listed and the concurrency group below keeps it to one
# run per tag.
name: CI

on:
  push:
    tags: ["v*"]
  create:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  stress:
    # `create` also fires for new branches and other tags: only version tags run.
    if: github.event_name != 'create' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v'))
    strategy:
      # One system failing doesn't hide the others' results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        # Git Bash on Windows: the same scripts everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: System libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libudev-dev
      - name: Unit tests
        run: cargo test --release --locked --no-default-features
      - name: Stress tests
        run: CARGO_FLAGS="--locked --no-default-features" tools/stress.sh
      - name: Fuzz tests
        run: OPNQ_FUZZ_SECS=60 CARGO_FLAGS="--locked --no-default-features" tools/fuzz.sh
